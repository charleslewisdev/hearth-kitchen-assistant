# Builds the two deployment images and pushes them to GitHub Container Registry, which is
# where the unraid templates in deploy/unraid/ pull from.
#
# GHCR under `charleslewisdev`, and nowhere else (D34) - not Docker Hub, not any other
# namespace. The namespace is written out rather than derived from `github.repository_owner`
# so that it is a fixed string an audit can grep for.
name: Publish images
on:
  push:
    branches: [main]
    # A release build. It publishes the same digest as the main push it points at, plus the
    # version tag, which is the only thing that distinguishes the two.
    tags: ['v*']
# The default token is read-only for packages. `packages: write` is what lets the login step
# below push, and it is the only reason this job needs a secret at all - no PAT, no org secret.
permissions: { contents: read, packages: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    # One image since D46: the API and the web app it serves. The earlier `hearth-server` and
    # `hearth-web` packages stop receiving tags from here on.
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built here rather than inline in `tags:` because the short SHA needs a shell, and
      # because the version tag is conditional. `latest` is what the unraid templates pull;
      # the short SHA is the immutable one to pin to, or to roll back onto.
      - id: tags
        env:
          IMAGE: ghcr.io/charleslewisdev/hearth
        run: |
          {
            echo 'tags<<EOF'
            echo "$IMAGE:latest"
            echo "$IMAGE:${GITHUB_SHA::7}"
            if [ "$GITHUB_REF_TYPE" = tag ]; then echo "$IMAGE:$GITHUB_REF_NAME"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          # The unraid box is x86_64. Building only what is deployed keeps the job to one
          # builder; add arm64 here if this ever has to run on a Pi.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
